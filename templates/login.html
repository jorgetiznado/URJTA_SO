<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — URJTA</title>
  <meta name="theme-color" content="#5e2900">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,sans-serif;background:#5e2900;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
    .card{background:#fff;border-radius:12px;padding:32px 26px;width:100%;max-width:360px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
    .logo{text-align:center;margin-bottom:22px}
    .logo img{width:56px;display:block;margin:0 auto 10px}
    .logo h2{color:#5e2900;font-size:1.1rem}
    .logo p{color:#888;font-size:.78rem;margin-top:4px}
    label{font-size:.82rem;color:#555;font-weight:bold;display:block;margin-bottom:6px;margin-top:14px}
    select,input{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:1rem}
    input:focus,select:focus{outline:none;border-color:#0f8a7e}
    button{width:100%;padding:14px;background:#0f8a7e;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:bold;cursor:pointer;margin-top:20px}
    button:active{background:#0c6d63}
    .error{background:#fde8e8;color:#e5231d;padding:10px 12px;border-radius:6px;font-size:.82rem;margin-bottom:14px;text-align:center}
    a{display:block;text-align:center;margin-top:16px;color:#888;font-size:.82rem;text-decoration:none}
    a:hover{color:#5e2900}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="/static/logo-mark.png" alt="URJTA">
      <h2>Iniciar sesión</h2>
      <p>Selecciona tu nombre para continuar</p>
    </div>
    {% if error %}
    <div class="error">❌ Datos incorrectos. Verifica tu nombre y PIN.</div>
    {% endif %}
    <form method="POST" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <label>Operador</label>
      <select name="operador_codigo" required autofocus>
        <option value="">— Seleccionar —</option>
        {% for op in operadores %}
        <option value="{{ op.CODIGO }}">{{ op.NOMBRE }} — {{ op.CARGO }}</option>
        {% endfor %}
      </select>
      <label>PIN</label>
      <input type="password" name="pin" placeholder="••••" inputmode="numeric" maxlength="6" required>
      <button type="submit">Ingresar →</button>
    </form>
    <a href="/">← Volver al inicio</a>
  </div>
</body>
</html>
