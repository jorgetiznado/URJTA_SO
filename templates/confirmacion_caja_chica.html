<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revisión Cortes</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,sans-serif;background:#f0f2f5;display:flex;justify-content:center;align-items:center;min-height:100vh}
    .card{background:#fff;border-radius:12px;padding:40px 32px;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.12);max-width:380px;width:90%}
    .icon{font-size:4rem;margin-bottom:16px}
    h2{color:#0f8a7e;margin-bottom:12px;font-size:1.3rem}
    .dato{background:#f8f9fa;border-radius:8px;padding:10px 14px;margin-bottom:8px;text-align:left}
    .dato label{font-size:.72rem;color:#999;display:block;text-transform:uppercase}
    .dato span{font-size:1rem;font-weight:bold;color:#222}
    .actions{margin-top:20px;display:flex;flex-direction:column;gap:10px}
    a{display:block;padding:12px 20px;border-radius:7px;text-decoration:none;font-weight:bold;font-size:.95rem;text-align:center}
    .btn-nuevo{background:#0f8a7e;color:#fff}
    .btn-inicio{background:#e8f0f8;color:#5e2900}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h2>Rendición guardada</h2>
    <div class="dato">
      <label>Solicitud</label>
      <span>N° {{ solicitud.ID }} — {{ solicitud.CATEGORIA }}</span>
    </div>
    <div class="dato">
      <label>Documento</label>
      <span>{{ solicitud.TIPO_DOCUMENTO }} {{ solicitud.NUM_DOCUMENTO }}</span>
    </div>
    <div class="dato">
      <label>Monto rendido</label>
      <span>${{ "{:,.0f}".format(solicitud.MONTO_TOTAL|float) }}</span>
    </div>
    <div class="actions">
      <a href="/caja-chica" class="btn-nuevo">💵 Volver a Caja Chica</a>
      <a href="/" class="btn-inicio">🏠 Inicio</a>
    </div>
  </div>
</body>
</html>
